# Autoformatter friendly markdownlint config (all formatting rules disabled)
default: true
blank_lines: false
bullet: false
html: false
indentation: false
line_length: false
spaces: false
url: false
whitespace: false
# Table column alignment is formatting, not correctness (see header comment).
MD060: false
# Docs pages carry a frontmatter `title:` and also open with an H1.
MD025:
  front_matter_title: ""
# .entire/graph-agent.md (managed, out of scope here) doesn't open with an H1.
MD041: false
# Same heading text under different parents (per-component docs) is fine.
MD024:
  siblings_only: true
